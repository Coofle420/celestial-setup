palette = "noctalia"
# palette "noctalia" is defined in the Noctalia-managed block at the bottom
add_newline = true

[username]
show_always = true
style_user = "bold magenta"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold magenta"
format = "[@$hostname]($style) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold magenta)"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = " "
style = "cyan"

[git_status]
style = "magenta"

[git_state]
style = "magenta"

[cmd_duration]
min_time = 500
style = "yellow"
format = "[ $duration]($style) "

[nix_shell]
symbol = " "
style = "magenta"
format = "[$symbol$name]($style) "

