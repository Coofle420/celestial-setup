# User override of /usr/share/xdg-desktop-portal/niri-portals.conf
# why: xdg-desktop-portal-gnome 49's FileChooser shows no window under niri
#      (not a real GNOME session) -> file dialogs in Avalonia apps like
#      Ryujinx-Nextendo silently do nothing. Route FileChooser to the gtk
#      backend, which renders a normal GTK file dialog on wlroots.
# Keep gnome as the default for everything else (ScreenCast/Screenshot/etc).

[preferred]
default=gnome;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
