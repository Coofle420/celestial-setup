[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = false
show_symlink   = true
linemode       = "size"

[preview]
max_width  = 1200
max_height = 1400
image_filter = "lanczos3"

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", for = "unix" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = ["open"] },
  { mime = "video/*", use = ["open"] },
]
